name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust — fmt, clippy, tests, advisories
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: extractions/setup-just@v4

      - name: Lint (fmt + clippy)
        run: just lint

      - name: Rust tests
        run: just test-rust

      # Regenerate the uniffi Swift bindings and fail if the committed copy is
      # stale. A drift here means the .app would hit a checksum-mismatch
      # fatalError at rshellInit() — catch it in CI instead of at launch.
      - name: Bindings drift check
        run: |
          just mac-bindings
          if ! git diff --exit-code -- bindings/; then
            echo "::error::Committed Swift bindings are stale. Run 'just mac-bindings' and commit the result."
            exit 1
          fi

  # Separate job: cargo-deny-action is a container action (Linux-only),
  # and advisory checking only parses Cargo.lock — no macOS deps needed.
  advisories:
    name: Dependency advisories, licenses, and sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  mac:
    name: macOS — build + Swift tests
    # macos-26 image: the widgets target uses ControlWidget, which needs
    # the macOS 26 SDK (Xcode 26); macos-15's Xcode 16.4 can't compile it.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - uses: extractions/setup-just@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Build app (unsigned, compiler validation)
        run: just mac-ci-build

      # Ad-hoc signing: the runner has no certificate for the project's
      # DEVELOPMENT_TEAM, and framework unit tests don't need one.
      - name: Swift framework unit tests
        run: |
          xcodebuild test \
            -project Agent-Ssh.xcodeproj \
            -scheme AgentSshMacOS \
            -destination 'platform=macOS' \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            DEVELOPMENT_TEAM= \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES

      - name: Swift FFI integration tests
        run: |
          xcodebuild test \
            -project Agent-Ssh.xcodeproj \
            -scheme AgentSshApp \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_ENTITLEMENTS=

  ios:
    name: iOS/iPadOS — build + logic tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - uses: Swatinem/rust-cache@v2

      - uses: extractions/setup-just@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Build iOS simulator app
        run: just ios-ci-build

      - name: iOS logic tests
        run: just ios-test
