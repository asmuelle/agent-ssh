name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the repo. Any step here runs
# third-party code (cargo build scripts / proc-macros, Homebrew formulae, SPM
# plugins, Xcode build phases), so the job token must not be able to write.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs, but let every push to main complete so each
  # commit keeps a full CI result (important for bisecting bindings-drift
  # regressions).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    name: Rust — fmt, clippy, tests, advisories
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Lint (fmt + clippy)
        run: just lint

      - name: Rust tests
        run: just test-rust

      # Regenerate the uniffi Swift bindings and fail if the committed copy is
      # stale. A drift here means the .app would hit a checksum-mismatch
      # fatalError at rshellInit() — catch it in CI instead of at launch.
      - name: Bindings drift check
        run: |
          just mac-bindings
          if ! git diff --exit-code -- bindings/; then
            echo "::error::Committed Swift bindings are stale. Run 'just mac-bindings' and commit the result."
            exit 1
          fi

  # Separate job: cargo-deny-action is a container action (Linux-only),
  # and advisory checking only parses Cargo.lock — no macOS deps needed.
  advisories:
    name: Dependency advisories, licenses, and sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: EmbarkStudios/cargo-deny-action@b66acf5e9fe20f8aba065be86778a8a4c846f902 # v2
        with:
          command: check

      - name: Enforce advisory exception review dates
        run: python3 scripts/check_advisory_ignores.py

  mac:
    name: macOS — build + Swift tests
    # macos-26 image: the widgets target uses ControlWidget, which needs
    # the macOS 26 SDK (Xcode 26); macos-15's Xcode 16.4 can't compile it.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Build app (unsigned, compiler validation)
        run: just mac-ci-build

      # Ad-hoc signing: the runner has no certificate for the project's
      # DEVELOPMENT_TEAM, and framework unit tests don't need one.
      - name: Swift framework unit tests
        run: |
          xcodebuild test \
            -project Agent-Ssh.xcodeproj \
            -scheme AgentSshMacOS \
            -destination 'platform=macOS' \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            DEVELOPMENT_TEAM= \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES

      - name: Swift FFI integration tests
        run: |
          xcodebuild test \
            -project Agent-Ssh.xcodeproj \
            -scheme AgentSshApp \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_ENTITLEMENTS=

  ios:
    name: iOS/iPadOS — build + logic tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Build iOS simulator app
        run: just ios-ci-build

      - name: iOS logic tests
        run: just ios-test
